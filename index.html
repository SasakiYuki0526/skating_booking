<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預約時段行事曆</title>
    <!-- FullCalendar 樣式檔 -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="booking-layout">
        <!-- 左側：小型月曆與管理解鎖區 -->
        <div class="calendar-sidebar">
            <div class="sidebar-header">
                <h2>選擇日期</h2>
                <button id="admin-toggle-btn" class="admin-btn">🔑 管理員登入</button>
            </div>

            <!-- 管理者專用面板 -->
            <div id="admin-panel" class="admin-panel hidden">
                <h3>新增時段設定</h3>
                <form id="add-slot-form">
                    <div class="form-group">
                        <label>起始日期：</label>
                        <input type="date" id="input-date" required>
                    </div>

                    <!-- 💡 改用時間滾盤選擇器 (開始與結束時間) -->
                    <!-- 時間區間選擇器 (自動計算 40 分鐘) -->
                    <div class="form-group">
                        <label>時間區間 (固定 40 分鐘)：</label>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <input type="time" id="input-start-time" required
                                style="padding: 6px; border-radius: 6px; border: 1px solid #cbd5e0; width: 45%;">
                            <span>至</span>
                            <input type="time" id="input-end-time" readonly required
                                style="padding: 6px; border-radius: 6px; border: 1px solid #cbd5e0; width: 45%; background-color: #edf2f7; cursor: not-allowed;">
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" style="margin-top: 10px;">新增單一時段</button>
                </form>

                <hr class="panel-divider">

                <!-- ⚡ 每週反覆新增區塊 -->
                <h3>⚡ 每週反覆新增此時段</h3>
                <p class="batch-desc">依上方設定的日期與時間，自動每週重複寫入：</p>
                <div class="form-group">
                    <label>重複週數：</label>
                    <select id="repeat-weeks"
                        style="padding: 6px; border-radius: 6px; border: 1px solid #cbd5e0; width: 100%;">
                        <option value="4">未來 4 週 (約 1 個月)</option>
                        <option value="8">未來 8 週 (約 2 個月)</option>
                        <option value="12">未來 12 週 (約 3 個月)</option>
                    </select>
                </div>
                <button type="button" id="batch-repeat-weekly-btn" class="batch-btn"
                    style="margin-top: 8px;">一鍵每週反覆新增</button>
            </div>

            <div id="mini-calendar"></div>
        </div>

        <!-- 右側：當天時段詳情 -->
        <div class="slots-main">
            <h2 id="selected-date-title">請選擇日期</h2>
            <div id="slots-container" class="slots-grid">
                <p class="placeholder-text">點擊左側日曆查看當天可預約時段</p>
            </div>
        </div>
    </div>

    <!-- 引入 FullCalendar 核心庫 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <!-- 引入主程式 -->
    <script type="module" src="app.js"></script>
</body>

</html>
